# Configuration de mypy pour la vérification statique des types Python

[mypy]

# Active le plugin django-stubs pour permettre à mypy
# de comprendre les éléments spécifiques à Django (modèles, QuerySets...)
plugins = mypy_django_plugin.main

# Vérifie également le contenu des fonctions qui ne possèdent
# pas encore d'annotations de types
check_untyped_defs = True


# Configuration du plugin django-stubs
[mypy.plugins.django-stubs]

# Indique le module de configuration Django (settings.py)
django_settings_module = "skillsExchange.settings"
