{% extends "base.html" %}

{% block main %}

{% if user.is_authenticated %}

    <section>
        <h2>Demande de l'aide </h2>

        <p>Indiquez quel est votre besoin.</p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <label>
            Choisissez une ou plusieurs dates
            <input type="date" name="dates"/>
            <input type="date" name="dates"/>
            <input type="date" name="dates"/>
            </label>

            <button type="submit">Enregistrer</button>

            <a href="{% url 'skillsApp:index' %}" class="btn-cancel">
                Annuler
            </a>
        </form>

    </section>

{% else %}
    <p>Vous devez être connecté pour accéder à cette page.</p>
    <a href="{% url 'skillsApp:index' %}"> Retour à la page d'accueil</a>
{% endif %}

{% endblock %}
